<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chess Puzzles TWA</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Chessboard.js + jQuery + Chess.js -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <style>
    :root {
      --bg-color: #1e1e24;
      --card-bg: #2b2b36;
      --accent-color: #6200ee;
      --text-color: #ffffff;
      --text-muted: #a0a0b0;
    }

    body {
      margin: 0;
      padding: 12px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      min-height: 100vh;
      user-select: none;
    }

    [dir="rtl"] { direction: rtl; }

    .header-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid #3f3f50;
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .lang-select {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid #3f3f50;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .stats-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 400px;
      padding: 12px 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    .stat-item { text-align: center; }
    .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .stat-value { font-size: 20px; font-weight: bold; }

    #board-container {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      margin-bottom: 12px;
    }

    .status-box {
      width: 100%;
      max-width: 400px;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      min-height: 24px;
      margin-bottom: 12px;
    }

    .controls {
      width: 100%;
      max-width: 400px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid #3f3f50;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent-color);
      border: none;
      grid-column: span 2;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 16px 0;
    }

    .input-rating {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #3f3f50;
      background: #1e1e24;
      color: #fff;
      font-size: 16px;
      text-align: center;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header-bar">
    <button class="icon-btn" onclick="openRatingModal()">⚙️</button>
    <span style="font-weight: bold; font-size: 18px;">♟️ Chess Puzzles</span>
    <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
      <option value="ru">Русский</option>
      <option value="en">English</option>
      <option value="he">עברית</option>
    </select>
  </div>

  <!-- Stats -->
  <div class="stats-card">
    <div class="stat-item">
      <div class="stat-label" id="lbl-rating">Рейтинг</div>
      <div class="stat-value" id="val-rating">1200</div>
    </div>
    <div class="stat-item">
      <div class="stat-label" id="lbl-streak">Серия</div>
      <div class="stat-value" id="val-streak">🔥 0</div>
    </div>
    <div class="stat-item">
      <div class="stat-label" id="lbl-turn">Ход</div>
      <div class="stat-value" id="val-turn">-</div>
    </div>
  </div>

  <!-- Board -->
  <div id="board-container">
    <div id="board" style="width: 100%;"></div>
  </div>

  <div id="status" class="status-box"></div>

  <!-- Controls -->
  <div class="controls">
    <button id="btn-hint" onclick="getHint()">💡 <span id="lbl-hint">Подсказка</span></button>
    <button id="btn-solution" onclick="showSolution()">👁️ <span id="lbl-solution">Решение</span></button>
    <button id="btn-next" class="btn-primary" onclick="loadNextPuzzle()">➡️ <span id="lbl-next">Следующая задача</span></button>
    <button id="btn-analysis" class="btn-primary hidden" style="background:#2196F3;" onclick="toggleAnalysis()">🔍 <span id="lbl-analysis">Режим анализа</span></button>
  </div>

  <!-- Rating Modal -->
  <div id="ratingModal" class="modal-overlay">
    <div class="modal">
      <h2 id="modal-title" style="margin-top:0;">Выберите рейтинг</h2>
      <p id="modal-desc" style="font-size: 13px; color: var(--text-muted);">Укажите ваш рейтинг Lichess:</p>
      
      <div class="preset-grid">
        <button onclick="setInitialRating(800)">800<br><small id="p-novice">Новичок</small></button>
        <button onclick="setInitialRating(1200)">1200<br><small id="p-amateur">Любитель</small></button>
        <button onclick="setInitialRating(1600)">1600<br><small id="p-pro">Опытный</small></button>
        <button onclick="setInitialRating(2000)">2000<br><small id="p-master">Мастер</small></button>
      </div>

      <input type="number" id="customRatingInput" class="input-rating" placeholder="Например: 1500" min="400" max="3000">
      <button class="btn-primary" onclick="setCustomRating()"><span id="lbl-start">Сохранить</span></button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const i18n = {
      ru: { rating: "Рейтинг", streak: "Серия", turn: "Ход", whiteTurn: "Белые", blackTurn: "Черные", hint: "Подсказка", solution: "Решение", next: "Следующая", analysis: "Анализ", modalTitle: "Ваш рейтинг", modalDesc: "Выбери пресет или введи свой рейтинг:", novice: "Новичок", amateur: "Любитель", pro: "Опытный", master: "Мастер", start: "Сохранить", correct: "🎉 Правильно! (+10)", wrong: "❌ Неверный ход! (-1)", yourTurn: "Ваш ход!", hintMsg: "Ходит фигура с поля ", solutionMsg: "Решение показано на доске.", loading: "Загрузка задачи...", analysisActive: "Режим анализа включен" },
      en: { rating: "Rating", streak: "Streak", turn: "Turn", whiteTurn: "White", blackTurn: "Black", hint: "Hint", solution: "Solution", next: "Next Puzzle", analysis: "Analysis", modalTitle: "Your Rating", modalDesc: "Select preset or enter rating:", novice: "Novice", amateur: "Amateur", pro: "Pro", master: "Master", start: "Save", correct: "🎉 Correct! (+10)", wrong: "❌ Wrong move! (-1)", yourTurn: "Your turn!", hintMsg: "Move piece from ", solutionMsg: "Solution displayed.", loading: "Loading puzzle...", analysisActive: "Free analysis mode active" },
      he: { rating: "דירוג", streak: "רצף", turn: "תור", whiteTurn: "לבן", blackTurn: "שחור", hint: "רמז", solution: "פתרון", next: "חידה הבאה", analysis: "ניתוח", modalTitle: "הדירוג שלך", modalDesc: "בחר רמה או הזן דירוג:", novice: "מתחיל", amateur: "חובבן", pro: "מתקדם", master: "מאסטר", start: "שמור", correct: "🎉 נכון מאוד! (+10)", wrong: "❌ מהלך שגוי! (-1)", yourTurn: "התור שלך!", hintMsg: "הזז את הכלי מ-", solutionMsg: "הפתרון מוצג.", loading: "טוען חידה...", analysisActive: "מצב ניתוח חופשי פעיל" }
    };

    let currentLang = 'ru';
    let userRating = 1200;
    let userStreak = 0;
    let board = null;
    let game = null;
    let puzzleData = null;
    let currentMoveIndex = 0;
    let isPuzzleActive = false;
    let isAnalysisMode = false;

    function haptic(type = 'light') {
      if (tg?.HapticFeedback) {
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
        else tg.HapticFeedback.impactOccurred('light');
      }
    }

    window.onload = () => { loadUserData(); };

    function loadUserData() {
      const localRating = localStorage.getItem('userRating');
      if (localRating) {
        userRating = parseInt(localRating);
        userStreak = parseInt(localStorage.getItem('userStreak') || 0);
        document.getElementById('ratingModal').classList.add('hidden');
      }
      initGame();
    }

    function saveUserData() {
      localStorage.setItem('userRating', userRating);
      localStorage.setItem('userStreak', userStreak);
    }

    function openRatingModal() {
      document.getElementById('ratingModal').classList.remove('hidden');
    }

    function changeLanguage(lang) {
      currentLang = lang;
      const t = i18n[lang];
      document.body.dir = lang === 'he' ? 'rtl' : 'ltr';

      document.getElementById('lbl-rating').innerText = t.rating;
      document.getElementById('lbl-streak').innerText = t.streak;
      document.getElementById('lbl-turn').innerText = t.turn;
      document.getElementById('lbl-hint').innerText = t.hint;
      document.getElementById('lbl-solution').innerText = t.solution;
      document.getElementById('lbl-next').innerText = t.next;
      document.getElementById('lbl-analysis').innerText = t.analysis;
      document.getElementById('modal-title').innerText = t.modalTitle;
      document.getElementById('modal-desc').innerText = t.modalDesc;
      document.getElementById('p-novice').innerText = t.novice;
      document.getElementById('p-amateur').innerText = t.amateur;
      document.getElementById('p-pro').innerText = t.pro;
      document.getElementById('p-master').innerText = t.master;
      document.getElementById('lbl-start').innerText = t.start;
      updateUI();
    }

    function setInitialRating(rating) {
      userRating = rating;
      document.getElementById('ratingModal').classList.add('hidden');
      saveUserData();
      updateUI();
      loadNextPuzzle();
    }

    function setCustomRating() {
      const val = parseInt(document.getElementById('customRatingInput').value);
      if (val >= 400 && val <= 3000) setInitialRating(val);
    }

    function initGame() {
      updateUI();
      loadNextPuzzle();
    }

    function updateUI() {
      document.getElementById('val-rating').innerText = userRating;
      document.getElementById('val-streak').innerText = `🔥 ${userStreak}`;
    }

    async function loadNextPuzzle() {
      document.getElementById('status').innerText = i18n[currentLang].loading;
      document.getElementById('btn-analysis').classList.add('hidden');
      isAnalysisMode = false;

      try {
        // Получаем случайную проверенную задачу Lichess
        const res = await fetch(`https://lichess.org/api/puzzle/next`);
        const data = await res.json();
        
        puzzleData = {
          fen: data.puzzle.fen,
          moves: data.puzzle.solution,
          rating: data.puzzle.rating
        };
      } catch (e) {
        // Резервный набор верных задач Lichess
        puzzleData = {
          fen: "r1bqkb1r/pppp1ppp/2n2n2/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4",
          moves: ["c4f7", "e8f7"],
          rating: userRating
        };
      }
      setupPuzzle();
    }

    function setupPuzzle() {
      game = new Chess(puzzleData.fen);
      currentMoveIndex = 0;
      isPuzzleActive = true;

      const playerColor = game.turn() === 'w' ? 'black' : 'white';
      
      const config = {
        draggable: true,
        position: puzzleData.fen,
        orientation: playerColor,
        // Надежный векторный источник картинок Lichess
        pieceTheme: 'https://lichess1.org/assets/piece/cburnett/{piece}.svg',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd
      };

      if (!board) {
        board = Chessboard('board', config);
      } else {
        board.orientation(playerColor);
        board.position(puzzleData.fen);
      }

      const opponentMove = puzzleData.moves[0];
      const from = opponentMove.substring(0, 2);
      const to = opponentMove.substring(2, 4);
      const promo = opponentMove.length === 5 ? opponentMove[4] : undefined;
      
      setTimeout(() => {
        game.move({ from, to, promotion: promo });
        board.position(game.fen());
        currentMoveIndex = 1;
        
        const turnText = playerColor === 'white' ? i18n[currentLang].whiteTurn : i18n[currentLang].blackTurn;
        document.getElementById('val-turn').innerText = turnText;
        document.getElementById('status').innerText = i18n[currentLang].yourTurn;
      }, 400);
    }

    function onDragStart(source, piece) {
      if (!isPuzzleActive && !isAnalysisMode) return false;
      if (game.game_over()) return false;
      if (isPuzzleActive) {
        if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
            (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
          return false;
        }
      }
    }

    function onDrop(source, target) {
      if (isAnalysisMode) {
        const move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';
        haptic('light');
        return;
      }

      const expectedMove = puzzleData.moves[currentMoveIndex];
      const expectedFrom = expectedMove.substring(0, 2);
      const expectedTo = expectedMove.substring(2, 4);

      if (source === expectedFrom && target === expectedTo) {
        game.move({ from: source, to: target, promotion: 'q' });
        currentMoveIndex++;
        haptic('light');

        if (currentMoveIndex >= puzzleData.moves.length) {
          isPuzzleActive = false;
          userRating += 10;
          userStreak += 1;
          saveUserData();
          updateUI();
          haptic('success');
          document.getElementById('status').innerText = i18n[currentLang].correct;
          document.getElementById('btn-analysis').classList.remove('hidden');
        } else {
          setTimeout(() => {
            const nextMove = puzzleData.moves[currentMoveIndex];
            const f = nextMove.substring(0, 2);
            const t = nextMove.substring(2, 4);
            game.move({ from: f, to: t, promotion: 'q' });
            board.position(game.fen());
            currentMoveIndex++;
          }, 300);
        }
      } else {
        userRating = Math.max(400, userRating - 1);
        userStreak = 0;
        saveUserData();
        updateUI();
        haptic('error');
        document.getElementById('status').innerText = i18n[currentLang].wrong;
        return 'snapback';
      }
    }

    function onSnapEnd() { board.position(game.fen()); }

    function getHint() {
      if (!isPuzzleActive) return;
      const expectedMove = puzzleData.moves[currentMoveIndex];
      const from = expectedMove.substring(0, 2).toUpperCase();
      document.getElementById('status').innerText = `${i18n[currentLang].hintMsg} ${from}`;
      haptic('light');
    }

    function showSolution() {
      if (!puzzleData) return;
      isPuzzleActive = false;
      userStreak = 0;
      saveUserData();
      updateUI();

      let tempGame = new Chess(puzzleData.fen);
      board.position(puzzleData.fen);

      let delay = 300;
      puzzleData.moves.forEach((mv) => {
        setTimeout(() => {
          const f = mv.substring(0, 2);
          const t = mv.substring(2, 4);
          tempGame.move({ from: f, to: t, promotion: 'q' });
          board.position(tempGame.fen());
          haptic('light');
        }, delay);
        delay += 500;
      });

      document.getElementById('status').innerText = i18n[currentLang].solutionMsg;
      document.getElementById('btn-analysis').classList.remove('hidden');
    }

    function toggleAnalysis() {
      isAnalysisMode = true;
      document.getElementById('status').innerText = i18n[currentLang].analysisActive;
      haptic('light');
    }

    window.onresize = () => { if (board) board.resize(); };
  </script>
</body>
</html>
