<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chess Puzzles TWA</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Chessboard.js + jQuery + Chess.js -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <style>
    :root {
      --bg-color: #121216;
      --card-bg: #1a1a22;
      --border-color: #2a2a36;
      --accent-color: #6366f1;
      --success-color: #10b981;
      --text-color: #f3f4f6;
      --text-muted: #9ca3af;
      --highlight-color: rgba(99, 102, 241, 0.4);
    }

    body {
      margin: 0;
      padding: 12px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      min-height: 100vh;
      user-select: none;
    }

    [dir="rtl"] { direction: rtl; }

    .header-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .lang-select {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .stats-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 400px;
      padding: 12px 16px;
      border-radius: 14px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    .stat-item { text-align: center; }
    .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .stat-value { font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 4px; }

    #board-container {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      margin-bottom: 12px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .square-highlight {
      background-color: var(--highlight-color) !important;
    }

    .status-box {
      width: 100%;
      max-width: 400px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      min-height: 24px;
      margin-bottom: 12px;
      color: var(--text-muted);
      transition: all 0.3s;
    }

    .status-success {
      color: var(--success-color);
      font-size: 16px;
    }

    .controls {
      width: 100%;
      max-width: 400px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    button svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    .btn-primary {
      background: var(--accent-color);
      border: none;
      grid-column: span 2;
    }

    .btn-success {
      background: var(--success-color) !important;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 20px;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0;
    }

    .input-rating {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: #121216;
      color: #fff;
      font-size: 16px;
      text-align: center;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header-bar">
    <button class="icon-btn" onclick="openRatingModal()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
    <span style="font-weight: 700; font-size: 16px; letter-spacing: 0.5px;">CHESS PUZZLES</span>
    <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
      <option value="ru">RU</option>
      <option value="en">EN</option>
      <option value="he">HE</option>
    </select>
  </div>

  <!-- Stats Bar -->
  <div class="stats-card">
    <div class="stat-item">
      <div class="stat-label" id="lbl-rating">Рейтинг</div>
      <div class="stat-value" id="val-rating">1200</div>
    </div>
    <div class="stat-item">
      <div class="stat-label" id="lbl-streak">Серия</div>
      <div class="stat-value">
        <svg style="width:16px; height:16px; stroke: #f59e0b;" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
        <span id="val-streak">0</span>
      </div>
    </div>
    <div class="stat-item">
      <div class="stat-label" id="lbl-turn">Ход</div>
      <div class="stat-value" id="val-turn">-</div>
    </div>
  </div>

  <!-- Board -->
  <div id="board-container">
    <div id="board" style="width: 100%;"></div>
  </div>

  <!-- Status -->
  <div id="status" class="status-box"></div>

  <!-- Controls -->
  <div class="controls">
    <button id="btn-hint" onclick="getHint()">
      <svg viewBox="0 0 24 24"><path d="M9 18h6pM10 22h4pM15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path></svg>
      <span id="lbl-hint">Подсказка</span>
    </button>
    <button id="btn-solution" onclick="showSolution()">
      <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      <span id="lbl-solution">Решение</span>
    </button>
    <button id="btn-next" class="btn-primary" onclick="loadNextPuzzle()">
      <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      <span id="lbl-next">Следующая задача</span>
    </button>
    <button id="btn-analysis" class="btn-primary hidden" style="background:#0284c7;" onclick="toggleAnalysis()">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <span id="lbl-analysis">Режим анализа</span>
    </button>
  </div>

  <!-- Rating Modal -->
  <div id="ratingModal" class="modal-overlay">
    <div class="modal">
      <h3 id="modal-title" style="margin-top:0;">Ваш рейтинг</h3>
      <p id="modal-desc" style="font-size: 13px; color: var(--text-muted);">Выберите пресет или введите свой рейтинг:</p>
      
      <div class="preset-grid">
        <button onclick="setInitialRating(800)">800<br><small id="p-novice">Новичок</small></button>
        <button onclick="setInitialRating(1200)">1200<br><small id="p-amateur">Любитель</small></button>
        <button onclick="setInitialRating(1600)">1600<br><small id="p-pro">Опытный</small></button>
        <button onclick="setInitialRating(2000)">2000<br><small id="p-master">Мастер</small></button>
      </div>

      <input type="number" id="customRatingInput" class="input-rating" placeholder="Например: 1500" min="400" max="3000">
      <button class="btn-primary" onclick="setCustomRating()"><span id="lbl-start">Сохранить</span></button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const i18n = {
      ru: { rating: "Рейтинг", streak: "Серия", turn: "Ход", whiteTurn: "Ваш (Белые)", blackTurn: "Ваш (Черные)", hint: "Подсказка", solution: "Решение", next: "Следующая задача", analysis: "Анализ", modalTitle: "Ваш рейтинг", modalDesc: "Выбери пресет или введи свой рейтинг:", novice: "Новичок", amateur: "Любитель", pro: "Опытный", master: "Мастер", start: "Сохранить", correct: "🎉 Отлично! Задача решена (+10)", tryAgain: "Неверно. Попробуйте еще раз!", wrong: "Вторая ошибка! (-1 к рейтингу)", yourTurn: "Ваш ход! Найдите лучший вариант.", hintMsg: "Походите фигурой с ", solutionMsg: "Сделайте подсвеченный ход на доске", loading: "Поиск задачи...", analysisActive: "Режим свободного анализа" },
      en: { rating: "Rating", streak: "Streak", turn: "Turn", whiteTurn: "Your move (White)", blackTurn: "Your move (Black)", hint: "Hint", solution: "Solution", next: "Next Puzzle", analysis: "Analysis", modalTitle: "Your Rating", modalDesc: "Select preset or enter rating:", novice: "Novice", amateur: "Amateur", pro: "Pro", master: "Master", start: "Save", correct: "🎉 Solved! (+10 rating)", tryAgain: "Wrong move. Try again!", wrong: "Second mistake! (-1 rating)", yourTurn: "Your turn! Find the best move.", hintMsg: "Move piece from ", solutionMsg: "Make highlighted move on board", loading: "Finding puzzle...", analysisActive: "Free analysis mode" },
      he: { rating: "דירוג", streak: "רצף", turn: "תור", whiteTurn: "תורך (לבן)", blackTurn: "תורך (שחור)", hint: "רמז", solution: "פתרון", next: "חידה הבאה", analysis: "ניתוח", modalTitle: "הדירוג שלך", modalDesc: "בחר רמה או הזן דירוג:", novice: "מתחיל", amateur: "חובבן", pro: "מתקדם", master: "מאסטר", start: "שמור", correct: "🎉 נפתר בהצלחה! (+10)", tryAgain: "מהלך שגוי. נסה שוב!", wrong: "טעות שנייה! (-1)", yourTurn: "התור שלך! מצא את המהלך הטוב ביותר.", hintMsg: "הזז את הכלי מ-", solutionMsg: "בצע את המהלך המודגש על הלוח", loading: "טוען חידה...", analysisActive: "מצב ניתוח חופשי" }
    };

    let currentLang = 'ru';
    let userRating = 1200;
    let userStreak = 0;
    let board = null;
    let game = null;
    let puzzleData = null;
    let currentMoveIndex = 0;
    let isPuzzleActive = false;
    let isAnalysisMode = false;
    let selectedSquare = null;
    let currentPuzzleMistakes = 0;

    function haptic(type = 'light') {
      if (tg?.HapticFeedback) {
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
        else tg.HapticFeedback.impactOccurred('light');
      }
    }

    window.onload = () => { loadUserData(); };

    function loadUserData() {
      const localRating = localStorage.getItem('userRating');
      if (localRating) {
        userRating = parseInt(localRating);
        userStreak = parseInt(localStorage.getItem('userStreak') || 0);
        document.getElementById('ratingModal').classList.add('hidden');
      }
      initGame();
    }

    function saveUserData() {
      localStorage.setItem('userRating', userRating);
      localStorage.setItem('userStreak', userStreak);
    }

    function openRatingModal() {
      document.getElementById('ratingModal').classList.remove('hidden');
    }

    function changeLanguage(lang) {
      currentLang = lang;
      const t = i18n[lang];
      document.body.dir = lang === 'he' ? 'rtl' : 'ltr';

      document.getElementById('lbl-rating').innerText = t.rating;
      document.getElementById('lbl-streak').innerText = t.streak;
      document.getElementById('lbl-turn').innerText = t.turn;
      document.getElementById('lbl-hint').innerText = t.hint;
      document.getElementById('lbl-solution').innerText = t.solution;
      document.getElementById('lbl-next').innerText = t.next;
      document.getElementById('lbl-analysis').innerText = t.analysis;
      document.getElementById('modal-title').innerText = t.modalTitle;
      document.getElementById('modal-desc').innerText = t.modalDesc;
      document.getElementById('p-novice').innerText = t.novice;
      document.getElementById('p-amateur').innerText = t.amateur;
      document.getElementById('p-pro').innerText = t.pro;
      document.getElementById('p-master').innerText = t.master;
      document.getElementById('lbl-start').innerText = t.start;
      updateUI();
    }

    function setInitialRating(rating) {
      userRating = rating;
      document.getElementById('ratingModal').classList.add('hidden');
      saveUserData();
      updateUI();
      loadNextPuzzle();
    }

    function setCustomRating() {
      const val = parseInt(document.getElementById('customRatingInput').value);
      if (val >= 400 && val <= 3000) setInitialRating(val);
    }

    function initGame() {
      updateUI();
      loadNextPuzzle();
    }

    function updateUI() {
      document.getElementById('val-rating').innerText = userRating;
      document.getElementById('val-streak').innerText = userStreak;
    }

    function clearHighlights() {
      $('#board .square-55d63').removeClass('square-highlight');
    }

    async function loadNextPuzzle() {
      const statusEl = document.getElementById('status');
      const nextBtn = document.getElementById('btn-next');
      
      statusEl.className = "status-box";
      statusEl.innerText = i18n[currentLang].loading;
      
      nextBtn.classList.remove('btn-success');
      document.getElementById('btn-analysis').classList.add('hidden');
      
      isAnalysisMode = false;
      currentPuzzleMistakes = 0;
      selectedSquare = null;
      clearHighlights();

      try {
        const res = await fetch(`https://lichess.org/api/puzzle/daily`);
        const data = await res.json();
        puzzleData = {
          fen: data.game.fen,
          moves: data.puzzle.solution,
          rating: data.puzzle.rating
        };
      } catch (e) {
        puzzleData = {
          fen: "r1bqkb1r/pppp1ppp/2n2n2/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4",
          moves: ["c4f7", "e8f7"],
          rating: userRating
        };
      }
      setupPuzzle();
    }

    function setupPuzzle() {
      game = new Chess(puzzleData.fen);
      currentMoveIndex = 0;
      isPuzzleActive = true;

      const playerColor = game.turn() === 'w' ? 'black' : 'white';
      
      const config = {
        draggable: true,
        position: puzzleData.fen,
        orientation: playerColor,
        pieceTheme: 'https://lichess1.org/assets/piece/cburnett/{piece}.svg',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd
      };

      if (!board) {
        board = Chessboard('board', config);
      } else {
        board.orientation(playerColor);
        board.position(puzzleData.fen);
      }

      // Клик по фигурам (Select & Move)
      $('#board .square-55d63').off('click').on('click', function() {
        const square = $(this).attr('data-square');
        handleSquareClick(square);
      });

      // Ход противника
      const opponentMove = puzzleData.moves[0];
      const from = opponentMove.substring(0, 2);
      const to = opponentMove.substring(2, 4);
      const promo = opponentMove.length === 5 ? opponentMove[4] : undefined;
      
      setTimeout(() => {
        game.move({ from, to, promotion: promo });
        board.position(game.fen());
        currentMoveIndex = 1;
        
        const turnText = playerColor === 'white' ? i18n[currentLang].whiteTurn : i18n[currentLang].blackTurn;
        document.getElementById('val-turn').innerText = turnText;
        document.getElementById('status').innerText = i18n[currentLang].yourTurn;
      }, 400);
    }

    function handleSquareClick(square) {
      if (!isPuzzleActive && !isAnalysisMode) return;

      if (!selectedSquare) {
        const piece = game.get(square);
        if (piece && ((game.turn() === 'w' && piece.color === 'w') || (game.turn() === 'b' && piece.color === 'b'))) {
          selectedSquare = square;
          clearHighlights();
          $(`#board .square-${square}`).addClass('square-highlight');
        }
      } else {
        const moveAttempt = processPlayerMove(selectedSquare, square);
        if (moveAttempt === 'snapback' || !moveAttempt) {
          const piece = game.get(square);
          if (piece && ((game.turn() === 'w' && piece.color === 'w') || (game.turn() === 'b' && piece.color === 'b'))) {
            selectedSquare = square;
            clearHighlights();
            $(`#board .square-${square}`).addClass('square-highlight');
            return;
          }
        }
        selectedSquare = null;
        clearHighlights();
      }
    }

    function onDragStart(source, piece) {
      if (!isPuzzleActive && !isAnalysisMode) return false;
      if (game.game_over()) return false;
      
      if (isPuzzleActive) {
        if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
            (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
          return false;
        }
      }
      selectedSquare = source;
      clearHighlights();
      $(`#board .square-${source}`).addClass('square-highlight');
    }

    function onDrop(source, target) {
      if (!isPuzzleActive && !isAnalysisMode) return 'snapback';
      const result = processPlayerMove(source, target);
      selectedSquare = null;
      clearHighlights();
      return result;
    }

    function processPlayerMove(source, target) {
      if (isAnalysisMode) {
        const move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';
        haptic('light');
        board.position(game.fen());
        return true;
      }

      const expectedMove = puzzleData.moves[currentMoveIndex];
      const expectedFrom = expectedMove.substring(0, 2);
      const expectedTo = expectedMove.substring(2, 4);

      if (source === expectedFrom && target === expectedTo) {
        // Правильный ход
        game.move({ from: source, to: target, promotion: 'q' });
        board.position(game.fen());
        currentMoveIndex++;
        haptic('light');

        if (currentMoveIndex >= puzzleData.moves.length) {
          // УСПЕШНОЕ ЗАВЕРШЕНИЕ ЗАДАЧИ
          isPuzzleActive = false;
          userRating += 10;
          userStreak += 1;
          saveUserData();
          updateUI();
          haptic('success');

          const statusEl = document.getElementById('status');
          statusEl.innerText = i18n[currentLang].correct;
          statusEl.className = "status-box status-success";

          const nextBtn = document.getElementById('btn-next');
          nextBtn.classList.add('btn-success');
          document.getElementById('btn-analysis').classList.remove('hidden');
        } else {
          // Ответ противника
          setTimeout(() => {
            const nextMove = puzzleData.moves[currentMoveIndex];
            const f = nextMove.substring(0, 2);
            const t = nextMove.substring(2, 4);
            game.move({ from: f, to: t, promotion: 'q' });
            board.position(game.fen());
            currentMoveIndex++;
          }, 350);
        }
        return true;
      } else {
        // Ошибка
        currentPuzzleMistakes++;
        haptic('error');

        if (currentPuzzleMistakes === 1) {
          document.getElementById('status').innerText = i18n[currentLang].tryAgain;
        } else if (currentPuzzleMistakes >= 2) {
          userRating = Math.max(400, userRating - 1);
          userStreak = 0;
          saveUserData();
          updateUI();
          document.getElementById('status').innerText = i18n[currentLang].wrong;
        }
        return 'snapback';
      }
    }

    function onSnapEnd() { board.position(game.fen()); }

    function getHint() {
      if (!isPuzzleActive) return;
      const expectedMove = puzzleData.moves[currentMoveIndex];
      const from = expectedMove.substring(0, 2);
      clearHighlights();
      $(`#board .square-${from}`).addClass('square-highlight');
      document.getElementById('status').innerText = `${i18n[currentLang].hintMsg} ${from.toUpperCase()}`;
      haptic('light');
    }

    function showSolution() {
      if (!puzzleData || !isPuzzleActive) return;
      const expectedMove = puzzleData.moves[currentMoveIndex];
      const from = expectedMove.substring(0, 2);
      const to = expectedMove.substring(2, 4);
      
      clearHighlights();
      $(`#board .square-${from}`).addClass('square-highlight');
      $(`#board .square-${to}`).addClass('square-highlight');

      document.getElementById('status').innerText = i18n[currentLang].solutionMsg;
      haptic('light');
    }

    function toggleAnalysis() {
      isAnalysisMode = true;
      document.getElementById('status').innerText = i18n[currentLang].analysisActive;
      document.getElementById('status').className = "status-box";
      haptic('light');
    }

    window.onresize = () => { if (board) board.resize(); };
  </script>
</body>
</html>
