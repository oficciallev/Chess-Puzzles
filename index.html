<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chess Puzzles TWA</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Chessboard.js + jQuery + Chess.js -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <style>
    :root {
      --bg-color: #121216;
      --card-bg: #1a1a22;
      --border-color: #2a2a36;
      --accent-color: #6366f1;
      --success-color: #10b981;
      --text-color: #f3f4f6;
      --text-muted: #9ca3af;
      --highlight-color: rgba(99, 102, 241, 0.6);
      --selected-square: rgba(16, 185, 129, 0.6);
      --hint-square: rgba(245, 158, 11, 0.7);
    }

    body {
      margin: 0;
      padding: 12px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      min-height: 100vh;
      user-select: none;
    }

    [dir="rtl"] { direction: rtl; }

    .header-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }

    .lang-select {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .stats-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 400px;
      padding: 12px 16px;
      border-radius: 14px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    .stat-item { text-align: center; }
    .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .stat-value { font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 4px; }

    #board-container {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      margin-bottom: 12px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .square-selected {
      box-shadow: inset 0 0 0 3px var(--success-color) !important;
      background-color: var(--selected-square) !important;
    }

    .square-hint {
      box-shadow: inset 0 0 0 3px #f59e0b !important;
      background-color: var(--hint-square) !important;
    }

    .status-box {
      width: 100%;
      max-width: 400px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      min-height: 24px;
      margin-bottom: 12px;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .status-success { color: var(--success-color); font-size: 16px; font-weight: 700; }

    .controls {
      width: 100%;
      max-width: 400px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }

    .btn-primary { background: var(--accent-color); border: none; grid-column: span 2; }
    .btn-success { background: var(--success-color) !important; }
    .preset-btn.active { border-color: var(--accent-color); background: rgba(99, 102, 241, 0.15); }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 20px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      position: relative;
    }

    .close-modal-btn {
      position: absolute;
      top: 16px; right: 16px;
      background: transparent; border: none;
      color: var(--text-muted); font-size: 20px;
      cursor: pointer; padding: 0;
    }

    .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
    .input-rating {
      width: 100%; padding: 12px; border-radius: 10px;
      border: 1px solid var(--border-color); background: #121216;
      color: #fff; font-size: 16px; text-align: center;
      box-sizing: border-box; margin-bottom: 12px;
    }
    .hidden { display: none !important; }

    /* Banner for solved puzzle */
    .win-banner {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(16, 185, 129, 0.95);
      color: #fff;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      pointer-events: none;
      z-index: 10;
      animation: popIn 0.3s ease-out;
    }

    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header-bar">
    <button class="icon-btn" onclick="openRatingModal()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
    <span style="font-weight: 700; font-size: 16px; letter-spacing: 0.5px;">CHESS PUZZLES</span>
    <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
      <option value="ru">RU</option>
      <option value="en">EN</option>
      <option value="he">HE</option>
    </select>
  </div>

  <!-- Stats Bar -->
  <div class="stats-card">
    <div class="stat-item">
      <div class="stat-label" id="lbl-rating">Рейтинг</div>
      <div class="stat-value" id="val-rating">1200</div>
    </div>
    <div class="stat-item">
      <div class="stat-label" id="lbl-streak">Серия</div>
      <div class="stat-value">
        <svg style="width:16px; height:16px; stroke: #f59e0b;" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
        <span id="val-streak">0</span>
      </div>
    </div>
    <div class="stat-item">
      <div class="stat-label" id="lbl-turn">Ход</div>
      <div class="stat-value" id="val-turn">-</div>
    </div>
  </div>

  <!-- Board -->
  <div id="board-container">
    <div id="board" style="width: 100%;"></div>
    <div id="winBanner" class="win-banner hidden">✓ Задача решена! (+10)</div>
  </div>

  <!-- Status -->
  <div id="status" class="status-box"></div>

  <!-- Controls -->
  <div class="controls">
    <button id="btn-hint" onclick="getHint()">
      <svg viewBox="0 0 24 24"><path d="M9 18h6pM10 22h4pM15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path></svg>
      <span id="lbl-hint">Подсказка</span>
    </button>
    <button id="btn-solution" onclick="showSolution()">
      <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      <span id="lbl-solution">Решение</span>
    </button>
    <button id="btn-next" class="btn-primary" onclick="loadNextPuzzle()">
      <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      <span id="lbl-next">Следующая задача</span>
    </button>
    <button id="btn-analysis" class="btn-primary hidden" style="background:#0284c7;" onclick="toggleAnalysis()">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <span id="lbl-analysis">Режим анализа</span>
    </button>
  </div>

  <!-- Rating Modal -->
  <div id="ratingModal" class="modal-overlay">
    <div class="modal">
      <button class="close-modal-btn" onclick="closeRatingModal()">✕</button>
      <h3 id="modal-title" style="margin-top:0;">Ваш рейтинг</h3>
      <p id="modal-desc" style="font-size: 13px; color: var(--text-muted);">Выберите пресет или введите свой рейтинг:</p>
      
      <div class="preset-grid">
        <button class="preset-btn" onclick="selectPreset(800, this)">800<br><small id="p-novice">Новичок</small></button>
        <button class="preset-btn" onclick="selectPreset(1200, this)">1200<br><small id="p-amateur">Любитель</small></button>
        <button class="preset-btn" onclick="selectPreset(1600, this)">1600<br><small id="p-pro">Опытный</small></button>
        <button class="preset-btn" onclick="selectPreset(2000, this)">2000<br><small id="p-master">Мастер</small></button>
      </div>

      <input type="number" id="customRatingInput" class="input-rating" placeholder="Например: 1500" min="400" max="3000">
      <button class="btn-primary" onclick="confirmRating()"><span id="lbl-start">Сохранить</span></button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const i18n = {
      ru: { rating: "Рейтинг", streak: "Серия", turn: "Ход", whiteTurn: "Ваш ход (Белые)", blackTurn: "Ваш ход (Черные)", hint: "Подсказка", solution: "Решение", next: "Следующая задача", analysis: "Анализ", modalTitle: "Ваш рейтинг", modalDesc: "Выбери пресет или введи свой рейтинг:", novice: "Новичок", amateur: "Любитель", pro: "Опытный", master: "Мастер", start: "Сохранить", correct: "🎉 Задача решена! (+10 к рейтингу)", tryAgain: "Неверный ход. Попробуйте еще раз!", wrong: "Вторая ошибка! (-1 к рейтингу)", yourTurn: "Ваш ход! Поставьте мат или выиграйте материал.", hintMsg: "Походите фигурой с поля ", solutionMsg: "Сделайте подсвеченный ход на доске", loading: "Поиск задачи...", analysisActive: "Режим свободного анализа", winBanner: "✓ Задача решена! (+10)" },
      en: { rating: "Rating", streak: "Streak", turn: "Turn", whiteTurn: "Your move (White)", blackTurn: "Your move (Black)", hint: "Hint", solution: "Solution", next: "Next Puzzle", analysis: "Analysis", modalTitle: "Your Rating", modalDesc: "Select preset or enter rating:", novice: "Novice", amateur: "Amateur", pro: "Pro", master: "Master", start: "Save", correct: "🎉 Solved! (+10 rating)", tryAgain: "Wrong move. Try again!", wrong: "Second mistake! (-1 rating)", yourTurn: "Your turn! Find checkmate or gain material.", hintMsg: "Move piece from square ", solutionMsg: "Make highlighted move on board", loading: "Finding puzzle...", analysisActive: "Free analysis mode", winBanner: "✓ Solved! (+10)" },
      he: { rating: "דירוג", streak: "רצף", turn: "תור", whiteTurn: "תורך (לבן)", blackTurn: "תורך (שחור)", hint: "רמז", solution: "פתרון", next: "חידה הבאה", analysis: "ניתוח", modalTitle: "הדירוג שלך", modalDesc: "בחר רמה או הזן דירוג:", novice: "מתחיל", amateur: "חובבן", pro: "מתקדם", master: "מאסטר", start: "שמור", correct: "🎉 נפתר בהצלחה! (+10)", tryAgain: "מהלך שגוי. נסה שוב!", wrong: "טעות שנייה! (-1)", yourTurn: "התור שלך! מצא מט או יתרון חומרי.", hintMsg: "הזז את הכלי מ משבצת ", solutionMsg: "בצע את המהלך המודגש על הלוח", loading: "טוען חידה...", analysisActive: "מצב ניתוח חופשי", winBanner: "✓ נפתר בהצלחה! (+10)" }
    };

    let currentLang = 'ru';
    let userRating = 1200;
    let userStreak = 0;
    let board = null;
    let game = null;
    let puzzleData = null;
    let currentMoveIndex = 0;
    let isPuzzleActive = false;
    let isAnalysisMode = false;
    let selectedSquare = null;
    let hintSquare = null;
    let currentPuzzleMistakes = 0;
    let playerColor = 'white';

    function haptic(type = 'light') {
      if (tg?.HapticFeedback) {
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
        else tg.HapticFeedback.impactOccurred('light');
      }
    }

    window.onload = () => { loadUserData(); };

    function loadUserData() {
      const localRating = localStorage.getItem('userRating');
      if (localRating) {
        userRating = parseInt(localRating);
        userStreak = parseInt(localStorage.getItem('userStreak') || 0);
        document.getElementById('ratingModal').classList.add('hidden');
      }
      initGame();
    }

    function saveUserData() {
      localStorage.setItem('userRating', userRating);
      localStorage.setItem('userStreak', userStreak);
    }

    function openRatingModal() {
      document.getElementById('customRatingInput').value = userRating;
      document.getElementById('ratingModal').classList.remove('hidden');
    }

    function closeRatingModal() {
      document.getElementById('ratingModal').classList.add('hidden');
    }

    function selectPreset(val, btn) {
      $('.preset-btn').removeClass('active');
      $(btn).addClass('active');
      document.getElementById('customRatingInput').value = val;
    }

    function confirmRating() {
      const val = parseInt(document.getElementById('customRatingInput').value);
      if (val >= 400 && val <= 3000) {
        userRating = val;
        saveUserData();
        updateUI();
        closeRatingModal();
        loadNextPuzzle();
      }
    }

    function changeLanguage(lang) {
      currentLang = lang;
      const t = i18n[lang];
      document.body.dir = lang === 'he' ? 'rtl' : 'ltr';

      document.getElementById('lbl-rating').innerText = t.rating;
      document.getElementById('lbl-streak').innerText = t.streak;
      document.getElementById('lbl-turn').innerText = t.turn;
      document.getElementById('lbl-hint').innerText = t.hint;
      document.getElementById('lbl-solution').innerText = t.solution;
      document.getElementById('lbl-next').innerText = t.next;
      document.getElementById('lbl-analysis').innerText = t.analysis;
      document.getElementById('modal-title').innerText = t.modalTitle;
      document.getElementById('modal-desc').innerText = t.modalDesc;
      document.getElementById('p-novice').innerText = t.novice;
      document.getElementById('p-amateur').innerText = t.amateur;
      document.getElementById('p-pro').innerText = t.pro;
      document.getElementById('p-master').innerText = t.master;
      document.getElementById('lbl-start').innerText = t.start;
      document.getElementById('winBanner').innerText = t.winBanner;
      
      updateUI();
      updateTurnText();
    }

    function updateTurnText() {
      if (!isPuzzleActive) return;
      const turnText = playerColor === 'white' ? i18n[currentLang].whiteTurn : i18n[currentLang].blackTurn;
      document.getElementById('val-turn').innerText = turnText;
      document.getElementById('status').innerText = i18n[currentLang].yourTurn;
    }

    function initGame() {
      updateUI();
      loadNextPuzzle();
    }

    function updateUI() {
      document.getElementById('val-rating').innerText = userRating;
      document.getElementById('val-streak').innerText = userStreak;
    }

    function clearHighlights() {
      $('#board .square-55d63').removeClass('square-selected square-hint');
    }

    async function loadNextPuzzle() {
      const statusEl = document.getElementById('status');
      const nextBtn = document.getElementById('btn-next');
      
      document.getElementById('winBanner').classList.add('hidden');
      statusEl.className = "status-box";
      statusEl.innerText = i18n[currentLang].loading;
      nextBtn.classList.remove('btn-success');
      document.getElementById('btn-analysis').classList.add('hidden');
      
      isAnalysisMode = false;
      currentPuzzleMistakes = 0;
      selectedSquare = null;
      hintSquare = null;
      clearHighlights();

      try {
        const res = await fetch(`https://lichess.org/api/puzzle/next`);
        const data = await res.json();
        puzzleData = {
          fen: data.puzzle.fen,
          moves: data.puzzle.solution,
          rating: data.puzzle.rating
        };
      } catch (e) {
        puzzleData = {
          fen: "r1bqkb1r/pppp1ppp/2n2n2/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4",
          moves: ["c4f7", "e8f7"],
          rating: userRating
        };
      }

      setupPuzzle();
    }

    function setupPuzzle() {
      game = new Chess(puzzleData.fen);
      currentMoveIndex = 0;
      isPuzzleActive = true;

      // Четкая ориентация доски: игроком выступает тот, кто делает 2-й ход (moves[1]) в решении
      const firstMoveColor = game.turn();
      playerColor = firstMoveColor === 'w' ? 'black' : 'white';
      
      const config = {
        draggable: true,
        position: puzzleData.fen,
        orientation: playerColor,
        pieceTheme: 'https://lichess1.org/assets/piece/cburnett/{piece}.svg',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd
      };

      if (!board) {
        board = Chessboard('board', config);
      } else {
        board.orientation(playerColor);
        board.position(puzzleData.fen);
      }

      setTimeout(() => { attachSquareClicks(); }, 100);

      // Вводный ход противника
      const opponentMove = puzzleData.moves[0];
      const from = opponentMove.substring(0, 2);
      const to = opponentMove.substring(2, 4);
      const promo = opponentMove.length === 5 ? opponentMove[4] : undefined;
      
      setTimeout(() => {
        game.move({ from, to, promotion: promo });
        board.position(game.fen());
        currentMoveIndex = 1;
        updateTurnText();
        attachSquareClicks();
      }, 350);
    }

    function attachSquareClicks() {
      $('#board .square-55d63').off('click').on('click', function(e) {
        e.stopPropagation();
        const square = $(this).attr('data-square');
        if (square) {
          handleSquareClick(square);
        }
      });
    }

    function reapplyHighlights() {
      clearHighlights();
      if (selectedSquare) $(`#board .square-${selectedSquare}`).addClass('square-selected');
      if (hintSquare) $(`#board .square-${hintSquare}`).addClass('square-hint');
    }

    function handleSquareClick(square) {
      if (!isPuzzleActive && !isAnalysisMode) return;

      const piece = game.get(square);
      const isMyPiece = piece && piece.color === (playerColor === 'white' ? 'w' : 'b');

      // Клик 1: подсвечиваем свою фигуру
      if (!selectedSquare) {
        if (isMyPiece) {
          selectedSquare = square;
          reapplyHighlights();
          haptic('light');
        }
        return;
      }

      // Повторный клик на ту же фигуру -> отмена выбора
      if (selectedSquare === square) {
        selectedSquare = null;
        reapplyHighlights();
        haptic('light');
        return;
      }

      // Клик на другую свою фигуру -> переключаем подстветку
      if (isMyPiece) {
        selectedSquare = square;
        reapplyHighlights();
        haptic('light');
        return;
      }

      // Клик на клетку назначения -> пробуем походить
      const from = selectedSquare;
      const to = square;
      selectedSquare = null;
      reapplyHighlights();
      processPlayerMove(from, to);
    }

    function onDragStart(source, piece) {
      if (!isPuzzleActive && !isAnalysisMode) return false;
      if (game.game_over()) return false;

      if (isPuzzleActive) {
        const expectedTurn = playerColor === 'white' ? 'w' : 'b';
        if (game.turn() !== expectedTurn) return false;
        if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
            (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
          return false;
        }
      }
      selectedSquare = source;
      reapplyHighlights();
    }

    function onDrop(source, target) {
      if (!isPuzzleActive && !isAnalysisMode) return 'snapback';
      if (source === target) return;

      const res = processPlayerMove(source, target);
      selectedSquare = null;
      reapplyHighlights();
      return res;
    }

    function processPlayerMove(source, target) {
      if (isAnalysisMode) {
        const move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';
        haptic('light');
        board.position(game.fen());
        attachSquareClicks();
        return true;
      }

      const expectedMove = puzzleData.moves[currentMoveIndex];
      const expectedFrom = expectedMove.substring(0, 2);
      const expectedTo = expectedMove.substring(2, 4);

      if (source === expectedFrom && target === expectedTo) {
        // Успешный ход
        game.move({ from: source, to: target, promotion: 'q' });
        board.position(game.fen());
        attachSquareClicks();
        currentMoveIndex++;
        hintSquare = null; // сбрасываем подсказку при верном ходе
        reapplyHighlights();
        haptic('light');

        if (currentMoveIndex >= puzzleData.moves.length) {
          // ЗАДАЧА УСПЕШНО РЕШЕНА
          isPuzzleActive = false;
          userRating += 10;
          userStreak += 1;
          saveUserData();
          updateUI();
          haptic('success');

          // Показываем плашку победы и подсвечиваем кнопку "Следующая задача"
          document.getElementById('winBanner').classList.remove('hidden');
          const statusEl = document.getElementById('status');
          statusEl.innerText = i18n[currentLang].correct;
          statusEl.className = "status-box status-success";

          const nextBtn = document.getElementById('btn-next');
          nextBtn.classList.add('btn-success');
          document.getElementById('btn-analysis').classList.remove('hidden');
        } else {
          // Ответ противника
          setTimeout(() => {
            const nextMove = puzzleData.moves[currentMoveIndex];
            const f = nextMove.substring(0, 2);
            const t = nextMove.substring(2, 4);
            game.move({ from: f, to: t, promotion: 'q' });
            board.position(game.fen());
            attachSquareClicks();
            currentMoveIndex++;
          }, 350);
        }
        return true;
      } else {
        // Ошибка
        currentPuzzleMistakes++;
        haptic('error');

        if (currentPuzzleMistakes === 1) {
          document.getElementById('status').innerText = i18n[currentLang].tryAgain;
        } else if (currentPuzzleMistakes >= 2) {
          userRating = Math.max(400, userRating - 1);
          userStreak = 0;
          currentPuzzleMistakes = 0;
          saveUserData();
          updateUI();
          document.getElementById('status').innerText = i18n[currentLang].wrong;
        }
        board.position(game.fen());
        attachSquareClicks();
        return 'snapback';
      }
    }

    function onSnapEnd() {
      board.position(game.fen());
      attachSquareClicks();
    }

    // Независимая кнопка подсказки
    function getHint() {
      if (!isPuzzleActive || !puzzleData) return;
      const expectedMove = puzzleData.moves[currentMoveIndex];
      hintSquare = expectedMove.substring(0, 2);
      reapplyHighlights();
      document.getElementById('status').innerText = `${i18n[currentLang].hintMsg} ${hintSquare.toUpperCase()}`;
      haptic('light');
    }

    function showSolution() {
      if (!puzzleData || !isPuzzleActive) return;
      const expectedMove = puzzleData.moves[currentMoveIndex];
      const from = expectedMove.substring(0, 2);
      const to = expectedMove.substring(2, 4);
      
      clearHighlights();
      $(`#board .square-${from}`).addClass('square-hint');
      $(`#board .square-${to}`).addClass('square-hint');

      document.getElementById('status').innerText = i18n[currentLang].solutionMsg;
      haptic('light');
    }

    function toggleAnalysis() {
      isAnalysisMode = true;
      document.getElementById('winBanner').classList.add('hidden');
      document.getElementById('status').innerText = i18n[currentLang].analysisActive;
      document.getElementById('status').className = "status-box";
      haptic('light');
    }

    window.onresize = () => { if (board) board.resize(); attachSquareClicks(); };
  </script>
</body>
</html>
